name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "src/**"
      - "static/**"
      - "docusaurus.config.ts"
      - "sidebars.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "static/**"
      - "docusaurus.config.ts"
      - "sidebars.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Superseded pull request runs are cancelled; every push to main/develop keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Without LFS: the build does not need the real videos and sample data, which saves LFS bandwidth
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # setup-node registers TypeScript problem matchers, so type errors appear as annotations
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # A full production build also catches broken links and invalid Markdown/MDX
      - name: Build
        run: npm run build
