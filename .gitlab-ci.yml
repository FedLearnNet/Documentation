stages:
  - dependencies
  - assemble
  - deploy

variables:
  CI_IMAGE_FLNET_BASE: $CI_REGISTRY/$CI_PROJECT_PATH/flnet-user-doc
  CI_IMAGE_POSYMED_BASE: $CI_REGISTRY/$CI_PROJECT_PATH/posymed-user-doc
  CI_IMAGE_FLNET_STAGING: $CI_IMAGE_FLNET_BASE:staging
  CI_IMAGE_FLNET_LATEST: $CI_IMAGE_FLNET_BASE:latest
  CI_IMAGE_POSYMED_STAGING: $CI_IMAGE_POSYMED_BASE:staging
  CI_IMAGE_POSYMED_LATEST: $CI_IMAGE_POSYMED_BASE:latest

  GHCR_IMAGE_FLNET_BASE: ghcr.io/fedlearnnet/user-doc/flnet-user-doc
  GHCR_IMAGE_POSYMED_BASE: ghcr.io/fedlearnnet/user-doc/posymed-user-doc
  GHCR_IMAGE_FLNET_STAGING: $GHCR_IMAGE_FLNET_BASE:staging
  GHCR_IMAGE_FLNET_LATEST: $GHCR_IMAGE_FLNET_BASE:latest
  GHCR_IMAGE_POSYMED_STAGING: $GHCR_IMAGE_POSYMED_BASE:staging
  GHCR_IMAGE_POSYMED_LATEST: $GHCR_IMAGE_POSYMED_BASE:latest

  DOCKER_TLS_CERTDIR: ""

.docker_login: &docker_login
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.docker_login_ghcr: &docker_login_ghcr
  - test -n "$GITHUB_USERNAME" || (echo "GITHUB_USERNAME is empty" && exit 1)
  - test -n "$GITHUB_TOKEN" || (echo "GITHUB_TOKEN is empty" && exit 1)
  - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin

.docker_buildx: &docker_buildx
  - docker context create FLNet-context || true
  - docker buildx create --name FLNetBuilder --use FLNet-context || docker buildx use FLNetBuilder
  - docker buildx inspect --bootstrap

.docker_buildxrm: &docker_buildxrm
  - docker buildx rm FLNetBuilder || true

install:
  image: node:lts
  stage: dependencies
  rules:
    - when: always
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - node_modules
    when: on_success
    expire_in: 6 hours
  # cache:
  #   key:
  #     files:
  #       - package-lock.json
  #   paths:
  #     - node_modules

.assemble:
  image: node:lts
  stage: assemble
  needs:
    - install
  dependencies:
    - install
  script:
    - npm run build
  artifacts:
    paths:
      - build
    expire_in: 6 hours

.assemble-posymed:
  image: node:lts
  stage: assemble
  needs:
    - install
  dependencies:
    - install
  script:
    - npm run build:posymed
  artifacts:
    paths:
      - build
    expire_in: 6 hours

.deploy:gitlab_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f Dockerfile --push .

.deploy:github_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login_ghcr
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f Dockerfile --push .

.brand:flnet:
  variables:
    DEPLOYED_PRODUCT_NAME: "Federated Learning Net"
    PRODUCT_SLUG: "flnet"
    DEPLOYED_PRODUCT_URL: "https://federated-learning.net"
    PRODUCT_TAGLINE: "A secure, locally governed Federated Learning Network for healthcare, industry, and research"
    PRODUCT_LOGO_PATH: "img/flnet/logo.svg"
    PRODUCT_LOGO_ALT: "FLNet Logo"
    PRODUCT_FAVICON_PATH: "img/flnet/logo.svg"

.brand:posymed:
  variables:
    DEPLOYED_PRODUCT_NAME: "PoSyMed"
    PRODUCT_SLUG: "posymed"
    DEPLOYED_PRODUCT_URL: "https://posymed.featurecloud.ai"
    PRODUCT_BASE_URL: "/posymed/documentation/"
    PRODUCT_TAGLINE: "Workflow design and execution made easy, reproducible and robust"
    PRODUCT_LOGO_PATH: "img/posymed/logo.svg"
    PRODUCT_LOGO_ALT: "PoSyMed Logo"
    PRODUCT_FAVICON_PATH: "img/posymed/logo.svg"

# Assemble
assemble:flnet:
  extends:
    - .assemble
    - .brand:flnet
  only:
    - main
    - develop

assemble:posymed:
  extends:
    - .assemble-posymed
    - .brand:posymed
  only:
    - main
    - develop

# Build and push
## FLNet
deploy:gitlab_registry:flnet:staging:
  extends:
    - .deploy:gitlab_registry
  dependencies:
    - assemble:flnet
  needs:
    - assemble:flnet
  only:
    - develop
  variables:
    CI_IMAGE: $CI_IMAGE_FLNET_STAGING

deploy:github_registry:flnet:staging:
  extends:
    - .deploy:github_registry
  dependencies:
    - assemble:flnet
  needs:
    - assemble:flnet
  only:
    - develop
  variables:
    CI_IMAGE: $GHCR_IMAGE_FLNET_STAGING

deploy:gitlab_registry:flnet:latest:
  extends:
    - .deploy:gitlab_registry
  dependencies:
    - assemble:flnet
  needs:
    - assemble:flnet
  only:
    - main
  variables:
    CI_IMAGE: $CI_IMAGE_FLNET_LATEST

deploy:github_registry:flnet:latest:
  extends:
    - .deploy:github_registry
  dependencies:
    - assemble:flnet
  needs:
    - assemble:flnet
  only:
    - main
  variables:
    CI_IMAGE: $GHCR_IMAGE_FLNET_LATEST

## Posymed
deploy:gitlab_registry:posymed:staging:
  extends:
    - .deploy:gitlab_registry
  dependencies:
    - assemble:posymed
  needs:
    - assemble:posymed
  only:
    - develop
  variables:
    CI_IMAGE: $CI_IMAGE_POSYMED_STAGING

deploy:github_registry:posymed:staging:
  extends:
    - .deploy:github_registry
  dependencies:
    - assemble:posymed
  needs:
    - assemble:posymed
  only:
    - develop
  variables:
    CI_IMAGE: $GHCR_IMAGE_POSYMED_STAGING

deploy:gitlab_registry:posymed:latest:
  extends:
    - .deploy:gitlab_registry
  dependencies:
    - assemble:posymed
  needs:
    - assemble:posymed
  only:
    - main
  variables:
    CI_IMAGE: $CI_IMAGE_POSYMED_LATEST

deploy:github_registry:posymed:latest:
  extends:
    - .deploy:github_registry
  dependencies:
    - assemble:posymed
  needs:
    - assemble:posymed
  only:
    - main
  variables:
    CI_IMAGE: $GHCR_IMAGE_POSYMED_LATEST