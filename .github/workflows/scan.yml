name: Container scan

on:
  workflow_dispatch:
  workflow_call:
  # Weekly scan of the published image
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fedlearnnet/documentation/flnet-user-doc:latest

jobs:
  scan:
    name: Scan flnet-user-doc:latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true

      # Findings appear under Security → Code scanning
      - uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-flnet-user-doc-latest
